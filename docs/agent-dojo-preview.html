*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0a1e;color:#e2e8f0;font-family:'Courier New',monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:1rem}
h1{font-size:1.2rem;color:#a78bfa;margin-bottom:1rem;text-align:center}
.grid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:900px}
.card{display:flex;flex-direction:column;align-items:center;background:#1a1333;border:1px solid #312e81;border-radius:6px;padding:8px 10px;width:120px}
.card .label{font-size:10px;color:#a78bfa;font-weight:bold;text-transform:uppercase;margin-bottom:2px}
.card .offline-tag{font-size:8px;color:#ef4444;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px}
.card canvas{image-rendering:pixelated;border-radius:2px}
.card .name{font-size:9px;color:#64748b;margin-top:4px;text-align:center}
.sprite-wrap{position:relative;display:inline-block}
@keyframes zzz{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-28px) scale(1.3)}}
.zzz{position:absolute;color:#a78bfa;font-weight:bold;font-size:11px;animation:zzz 2.2s ease-out infinite;pointer-events:none}
</style>
</head>

  waiting:     {frames:[WAITING_A,WAITING_B],     ms:600,  label:'WAITING',     sub:'GPT · MOC-18'},
  sleeping:    {frames:[SLEEPING_A,SLEEPING_B],   ms:1000, label:'SLEEPING',    sub:'Claude · idle'},
  vacationing: {frames:[VACATIONING_A,VACATIONING_B], ms:1400, label:'VACATIONING', sub:'Mistral', offline:true},
  overloaded:  {frames:[OVERLOADED_A,OVERLOADED_B],  ms:180,  label:'OVERLOADED',  sub:'Llama · MOC-22,23'},
  victory:     {frames:[VICTORY_A,VICTORY_B],     ms:350,  label:'VICTORY',     sub:'Claude · ✓ done'},
  defeat:      {frames:[DEFEAT_A,DEFEAT_B],       ms:700,  label:'DEFEAT',      sub:'GPT · ✗ failed'},
};

// ─── Renderer ──────────────────────────────────────────────────────────────
function drawFrame(ctx, frame, scale) {
  const h = frame.length, w = frame[0].length;
  ctx.clearRect(0, 0, w * scale, h * scale);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const c = P[frame[y][x]];
      if (c) { ctx.fillStyle = c; ctx.fillRect(x * scale, y * scale, scale, scale); }
    }
  }
}

const grid = document.getElementById('grid');
const SCALE = 5;

Object.entries(STATES).forEach(([key, st]) => {
  const card = document.createElement('div');
  card.className = 'card';

  // State label
  const lbl = document.createElement('div');
  lbl.className = 'label';
  lbl.textContent = st.label;
  card.appendChild(lbl);

  // "runtime offline" tag — only for VACATIONING
  if (st.offline) {
    const tag = document.createElement('div');
    tag.className = 'offline-tag';
    tag.textContent = 'runtime offline';
    card.appendChild(tag);
  }

  // Sprite canvas
  const wrap = document.createElement('div');
  wrap.className = 'sprite-wrap';

  const cvs = document.createElement('canvas');
  cvs.width  = 16 * SCALE;
  cvs.height = 24 * SCALE;
  cvs.style.width  = 16 * SCALE + 'px';
  cvs.style.height = 24 * SCALE + 'px';
  const ctx = cvs.getContext('2d');

  let idx = 0;
  drawFrame(ctx, st.frames[0], SCALE);
  setInterval(() => { idx = (idx + 1) % st.frames.length; drawFrame(ctx, st.frames[idx], SCALE); }, st.ms);

  wrap.appendChild(cvs);

  // zzz floating letters — only for SLEEPING (online + idle)
  if (key === 'sleeping') {
    ['z', 'Z', 'Z'].forEach((ch, i) => {
      const z = document.createElement('span');
      z.className = 'zzz';
      z.textContent = ch;
      z.style.right = (2 + i * 10) + 'px';
      z.style.top   = (15 + i * 6) + 'px';
      z.style.animationDelay = (i * 0.7) + 's';
      z.style.fontSize = (10 + i * 3) + 'px';
      wrap.appendChild(z);
    });
  }

  card.appendChild(wrap);

  // Bottom agent/task name
  const nm = document.createElement('div');
  nm.className = 'name';
  nm.textContent = st.sub;
  card.appendChild(nm);

  grid.appendChild(card);
});
